<!doctype html>
<!--
  한국어 원고 그림 fig:balance-cap(3장, 엔도스랭크의 허락 그래프)의 원본이며, Figures/balance-cap.pdf를 만든다.
  LaTeX는 HTML을 읽지 못한다. 이 파일을 고친 뒤 overleaf-github-ko/에서 다음을 실행한다.
      python -B -X utf8 ../overleaf-github/Figures/html/render.py Figures/html/balance-cap.html
  영어 원본은 ../overleaf-github/Figures/html/balance-cap.html이고, 내용과 배치와 크기가 같다. 모양은 영어 그림의
  style.css와 fig.js를 그대로 링크해서 가져오고, 이 파일에는 한글 글꼴과 줄바꿈, 한글 자간만 더한다.

  그림의 내용: 주인-스펜더 쌍 하나가 토큰 하나에서 허락 그래프에 어떻게 들어가는지. 점수 기간의 마지막 허락 a*(금색
  막대)를 동결 시점 주인이 가진 그 토큰의 잔액(청록 막대)과 견준다. 둘 다 동결일의 가격으로 바꾼 달러이고, 둘 가운데
  작은 쪽 â = min(a*, 잔액)만 센다(꽉 찬 부분).
  네 경우(위에서 아래로): 잔액보다 작은 허락은 허락을 센다. 무제한 허락은 잔액을 센다. 동결 시점에 그 토큰을 하나도
  갖지 않은 주인은 화살표를 만들지 않는다. 마지막 허락이 0이면 화살표가 없어진다.
  오른쪽 열은 경우마다 무엇을 세는지 적는다: â와 그 아래 "이 금액의 화살표"(처음 두 경우; 막대는 화살표 무게가 아니라
  달러 금액이다) 또는 "화살표 없음"(나머지 두 경우).
  아래: C-PR의 허락 층에서는 상한을 씌운 허락마다 U로도 묶어서 min(â, U)로 들어간다.
  막대 길이는 보기일 뿐이고 자료가 아니다.

  모양(STYLE.md, "Bars of an amount"): 회색 0선에서 시작하는, 끝이 네모난 납작한 막대. 허락 가운데 세는 부분은 꽉 찬
  금색이고, 보이기만 하고 세지 않는 부분은 가는 금색 선 안의 옅은 금색이다. 잔액은 가는 청록 선 안의 옅은 청록이어서,
  한 줄에서 꽉 찬 것은 세는 부분 하나뿐이다. 윗끝에 점이 있는 가는 검은 선이 두 막대를 가로질러 세는 금액을 표시한다.
  C-PR의 줄은 꽉 찬 보라 막대 뒤의 옅은 판이고, 세는 부분은 U의 선까지 꽉 찬 보라다. 변수는 Palatino 이탤릭이고,
  금액에는 가장 큰 값이 없으므로 막대 밑에 바탕 줄이 없다. 라틴 글자와 숫자는 Bahnschrift(반축소, 영어 그림의 자간),
  한글은 Noto Sans KR(보통 400, 굵게 700)이고, 한글에는 자간을 두지 않는다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>잔액 상한</title>
<link rel="stylesheet" href="../../../overleaf-github/Figures/html/style.css">
<script src="../../../overleaf-github/Figures/html/fig.js"></script>
<style>
/* 한글: 라틴 글꼴 뒤에 Noto 글꼴을 둔다. 두 글꼴은 가변 글꼴(기본 굵기 100)이라 굵기를 늘 적는다. */
:root {
  --serif:"Palatino Linotype", "Book Antiqua", Palatino, "TeX Gyre Pagella", "Cambria Math", "Noto Serif KR", serif;
  --sans:Bahnschrift, "DIN Alternate", "D-DIN", Barlow, "Segoe UI", Arial, "Noto Sans KR", sans-serif;
}
body { font-weight:400; word-break:keep-all; }
b, strong { font-weight:700; }
.h { font-weight:400; }
svg text:not([font-family]) { font-family:Bahnschrift, "Segoe UI", Arial, "Noto Sans KR", sans-serif; }
/* SVG 글자: fig.js가 적는 글꼴 속성보다 CSS가 앞서므로, 여기서 Noto 글꼴을 뒤에 더한다 */
svg text.sans { font-family:Bahnschrift, "Segoe UI", Arial, "Noto Sans KR", sans-serif; }
svg text.serif, svg tspan.serif { font-family:"Palatino Linotype", "Book Antiqua", Palatino, "Cambria Math", "Noto Serif KR", serif; }
.ko { letter-spacing:0; }                    /* 한글에는 자간을 두지 않는다(라틴 글자는 영어 그림의 자간) */
</style>
</head>
<body>
<div class="fig"><svg id="s" width="165mm" height="57mm" viewBox="0 0 165 57"></svg></div>
<script>
// 한글 글자(와 그 사이의 빈칸)를 class="ko"로 감싸 자간을 0으로 둔다. HTML에서는 <span>, SVG 글자 안에서는 <tspan>이다.
// SVG 글자는 Fig.text와 Fig.rich가 만들 때 바로 감싸므로, 크기를 재는 코드는 감싼 뒤의 너비를 읽는다. 가운데나 오른쪽에
// 맞춘 글자가 한글로 끝나면 끝 자간이 없으니, fig.js가 그만큼 옮겨 둔 x를 되돌린다.
const KO = (function () {
  const H = "ᄀ-ᇿ㄰-㆏가-힣", run = new RegExp(`[${H}]+(?:\\s+[${H}]+)*`, "g"), any = new RegExp(`[${H}]`), last = new RegExp(`[${H}]\\s*$`);
  const NS = "http://www.w3.org/2000/svg";
  function wrap(root) {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
    for (let n; (n = w.nextNode());) {
      const p = n.parentElement;
      if (p && !(p.classList && p.classList.contains("ko")) && p.tagName !== "STYLE" && p.tagName !== "SCRIPT" && any.test(n.textContent)) nodes.push(n);
    }
    for (const n of nodes) {
      const svg = n.parentElement.closest("svg"), s = n.textContent, frag = document.createDocumentFragment();
      let at0 = 0;
      s.replace(run, (m, at) => {
        if (at > at0) frag.appendChild(document.createTextNode(s.slice(at0, at)));
        const k = svg ? document.createElementNS(NS, "tspan") : document.createElement("span");
        k.setAttribute("class", "ko"); k.textContent = m;
        if (svg) k.style.letterSpacing = "0px";
        frag.appendChild(k);
        at0 = at + m.length;
      });
      if (at0 < s.length) frag.appendChild(document.createTextNode(s.slice(at0)));
      n.replaceWith(frag);
    }
  }
  function svgText(t) {
    if (!t || !any.test(t.textContent)) return t;
    const sp = parseFloat(t.style.letterSpacing) || 0, a = t.getAttribute("text-anchor");
    if (sp && last.test(t.textContent) && (a === "middle" || a === "end"))
      t.setAttribute("x", (parseFloat(t.getAttribute("x")) - (a === "middle" ? sp / 2 : sp)).toFixed(3));
    wrap(t);
    return t;
  }
  for (const k of ["text", "rich"]) { const f = Fig[k]; Fig[k] = (...args) => svgText(f(...args)); }
  return { wrap };
})();

const svg = document.getElementById("s"), C = Fig.C;
const E = (tag, a, parent) => Fig.el(parent || svg, tag, a);
// $변수$(Palatino 이탤릭), #바로 선 Palatino#, _{아래 첨자}를 쓰는 글자: Fig.rich. 2.5 mm = 7.1 pt, 이 그림에서 가장 작은 글자
const rich = (x, y, s, o = {}) => Fig.rich(svg, x, y, s, Object.assign({ size: 2.5, fill: C.text }, o));
const X0 = 47, W = 62, BH = 2.6;              // 막대 자리는 X0(금액 0)에서 시작하고 W mm 길이
const LINE = 0.25;                            // 보이기만 하고 세지 않는 부분의 테두리

// 머리
rich(0, 3.2, "주인–스펜더 쌍 하나와 토큰 하나. 금액은 동결일의 가격으로 바꾼 달러", { fill: C.muted });
E("rect", { x: X0 + 0.15, y: 5.6, width: 4.2, height: 2.2, fill: C.allowBg, stroke: C.allow, "stroke-width": LINE });
rich(X0 + 5.6, 7.5, "마지막 허락 $a$#*#");
E("rect", { x: X0 + 33, y: 5.6, width: 4.2, height: 2.2, fill: C.contractBg, stroke: C.contract, "stroke-width": LINE });
rich(X0 + 38.5, 7.5, "동결 시점 주인의 잔액");
rich(127, 7.5, "세는 값", { weight: 700, fill: C.ink });

// 한 경우: a = 허락의 길이(Infinity = 무제한), b = 잔액의 길이(막대 자리 안의 mm)
function row(y, label, a, b, result, edge) {
  rich(0, y + 2.7, label, { weight: 700, fill: C.ink });
  const aw = a === Infinity ? W : a, m = Math.min(aw, b);
  // 허락: 세지 않는 부분은 가는 선 안의 옅은 색, 세는 부분은 꽉 찬 색
  if (aw > m) E("rect", { x: X0 + m, y, width: aw - m, height: BH, fill: C.allowBg, stroke: C.allow, "stroke-width": LINE });
  if (m > 0) E("rect", { x: X0, y, width: m, height: BH, fill: C.allowBand });
  if (aw === 0) rich(X0 + 1, y + 2.2, "0", { fill: C.allowInk });
  if (a === Infinity) rich(X0 + W + 1.0, y + 2.2, "무제한", { fill: C.allowInk });
  // 주인의 잔액
  if (b > 0) E("rect", { x: X0, y: y + BH + 0.9, width: b, height: BH, fill: C.contractBg, stroke: C.contract, "stroke-width": LINE });
  else rich(X0 + 1, y + BH + 3.1, "0", { fill: C.contractInk });
  // 금액의 0선
  E("path", { d: `M${X0},${y - 0.6} V${y + 2 * BH + 1.8}`, stroke: C.rule, "stroke-width": 0.3 });
  // 세는 금액: 두 막대를 가로지르는 가는 선, 윗끝에 점
  if (m > 0) {
    E("path", { d: `M${X0 + m},${y - 0.9} V${y + 2 * BH + 1.8}`, stroke: C.ink, "stroke-width": 0.3 });
    E("circle", { cx: X0 + m, cy: y - 0.9, r: 0.5, fill: C.ink });
  }
  rich(127, y + 2.0, result, { weight: 700, fill: edge ? C.allowInk : C.muted });
  rich(127, y + 5.1, edge ? "이 금액의 화살표" : "화살표 없음", { fill: C.muted });
}
row(11.0, "잔액보다 작은 허락", 30, 58, "$â$ = $a$#*#", true);
row(20.6, "무제한 허락", Infinity, 44, "$â$ = 잔액", true);
row(30.2, "주인이 토큰을 하나도 갖지 않음", 52, 0, "$â$ = 0", false);
row(39.8, "마지막 허락이 0", 0, 40, "$â$ = 0", false);

// C-PR의 상한 U: 꽉 찬 보라 막대 뒤의 옅은 판
E("rect", { x: 0, y: 48.6, width: 165, height: 8.2, fill: C.plate });
E("rect", { x: 0, y: 48.6, width: 1.3, height: 8.2, fill: C.coupled });
rich(3.2, 54.0, "C-PR의 허락 층", { weight: 700, fill: C.coupledInk });
E("rect", { x: X0 + 36, y: 52.0, width: 20, height: BH, fill: C.coupledBg, stroke: C.coupled, "stroke-width": LINE });
E("rect", { x: X0, y: 52.0, width: 36, height: BH, fill: C.coupled });
E("path", { d: `M${X0 + 36},${50.2} V${55.4}`, stroke: C.coupledInk, "stroke-width": 0.4 });
rich(X0 + 36.9, 51.6, "$U$", { fill: C.coupledInk });
rich(X0 + 57.4, 54.2, "$â$", { fill: C.coupledInk });
rich(127, 54.2, "min($â$, $U$)", { weight: 700, fill: C.coupledInk });
</script>
</body>
</html>
