<!doctype html>
<!--
  한국어 원고 그림 fig:pipeline-architecture(3장, 처리 과정의 짜임)의 원본이며, Figures/pipeline-architecture.pdf를 만든다.
  LaTeX는 HTML을 읽지 못한다. 이 파일을 고친 뒤 overleaf-github-ko/에서 다음을 실행한다.
      python -B -X utf8 ../overleaf-github/Figures/html/render.py Figures/html/pipeline-architecture.html
  영어 원본은 ../overleaf-github/Figures/html/pipeline-architecture.html이고, 내용과 배치와 크기가 같다. 모양은 영어
  그림의 style.css와 fig.js를 그대로 링크해서 가져오고, 이 파일에는 한글 글꼴과 줄바꿈, 한글 자간만 더한다.

  그림의 내용: 공개 로그에서 표까지의 처리 과정, 두 부분.
  원격(자료 얻기, 이 연구의 BigQuery 프로젝트 안), 왼쪽에서 오른쪽으로: BigQuery 공개 로그 -> 로그 뽑기(스캔 A와 B;
  토픽으로 거르기) -> 끝 점 종류 판별(트랜잭션 보낸 주소; RPC로 코드 읽기) -> 잔액, 계약 사이의 쌍 표, 코호트와 라벨.
  만들어진 표는 내려받고 절대 바꾸지 않는다.
  로컬(내려받은 표로 다시 할 수 있음): 표 불러오기, 그다음 네 갈래:
    화살표 목록 만들기 -> 페이지랭크 점수(EndorseRank, AWP, C-PR, S-PR) -> 일치도와 벤치마크;
    점검(같은 기간 대리 지표: 송금 지표와 안정성 지표는 내려받은 표와 함께 오고, 허락 점검은 상한을 씌운 허락으로
      여기서 계산한다) -> 일치도와 벤치마크;
    시간 홀드아웃(W0과 W1);
    발견 순서 검증(두 동결의 크롤);
  그리고 일치도와 벤치마크, 홀드아웃, 발견 순서 검증이 표와 그림 내보내기로 들어간다.
  로컬 띠의 이름은 내려받기 연결선의 오른쪽에 있고, 그 연결선은 이름 옆에서 띠로 들어간다.

  모양: 부분마다 Palatino 제목(라틴 글자는 Palatino, 한글은 Noto Serif KR)을 꽉 찬 점 뒤에 둔 옅은 회색 판이다. 단계는
  왼쪽에 자기 색의 꽉 찬 막대가 있는 흰 상자다(회색: 중립 단계; 청록: 계약; 보라: 점수; 점검과 일치도, 홀드아웃, 발견 순서
  검증은 RQ1, RQ3, RQ2의 색). 영어 그림에 그림 문자가 있는 상자에는 같은 그림 문자가 그 색의 고리 두른 원 안에 흰색으로
  있다. 연결선은 가는 회색 선이고, 갈라지거나 모이는 곳에 점이 있다.
  크기와 자리: 원격 단계 넷은 크기가 같고 같은 간격으로 선다. 로컬 부분의 작은 단계 네 줄은 높이가 같고 같은 간격으로
  선다. 표 불러오기, 일치도, 내보내기는 크기가 같고 두 줄 높이다(일치도는 1–2줄, 표 불러오기와 내보내기는 2–3줄에 걸쳐서,
  둘 다 네 줄의 가운데에 선다. 그래서 표 불러오기에서 나온 선이 부채의 가운데에 닿고, 내보내기로 가는 선이 그 부채의
  가운데에서 나온다). 상자는 모두 판에서 2.6 mm 안쪽에 서고, 두 판의 왼쪽 끝과 오른쪽 끝 상자는 바깥 가장자리를
  함께 쓴다. 라틴 글자와 숫자는 Bahnschrift(반축소, 영어 그림의 자간), 한글은 Noto Sans KR(보통 400, 굵게 700)이고,
  한글에는 자간을 두지 않는다. 상자에 맞추려고 몇 상자는 제목을 영어와 다르게 나누었다(화살표 목록 / 만들기,
  일치도와 / 벤치마크, 표와 그림 / 내보내기).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>처리 과정 한눈에 보기</title>
<link rel="stylesheet" href="../../../overleaf-github/Figures/html/style.css">
<script src="../../../overleaf-github/Figures/html/fig.js"></script>
<style>
/* 한글: 라틴 글꼴 뒤에 Noto 글꼴을 둔다. 두 글꼴은 가변 글꼴(기본 굵기 100)이라 굵기를 늘 적는다. */
:root {
  --serif:"Palatino Linotype", "Book Antiqua", Palatino, "TeX Gyre Pagella", "Cambria Math", "Noto Serif KR", serif;
  --sans:Bahnschrift, "DIN Alternate", "D-DIN", Barlow, "Segoe UI", Arial, "Noto Sans KR", sans-serif;
}
body { font-weight:400; word-break:keep-all; }
b, strong { font-weight:700; }
.h { font-weight:400; }
svg text:not([font-family]) { font-family:Bahnschrift, "Segoe UI", Arial, "Noto Sans KR", sans-serif; }
/* SVG 글자: fig.js가 적는 글꼴 속성보다 CSS가 앞서므로, 여기서 Noto 글꼴을 뒤에 더한다 */
svg text.sans { font-family:Bahnschrift, "Segoe UI", Arial, "Noto Sans KR", sans-serif; }
svg text.serif, svg tspan.serif { font-family:"Palatino Linotype", "Book Antiqua", Palatino, "Cambria Math", "Noto Serif KR", serif; }
.ko { letter-spacing:0; }                    /* 한글에는 자간을 두지 않는다(라틴 글자는 영어 그림의 자간) */
</style>
</head>
<body>
<div class="fig"><svg id="s" width="165mm" height="66mm" viewBox="0 0 165 66"></svg></div>
<script>
// 한글 글자(와 그 사이의 빈칸)를 class="ko"로 감싸 자간을 0으로 둔다. HTML에서는 <span>, SVG 글자 안에서는 <tspan>이다.
// SVG 글자는 Fig.text와 Fig.rich가 만들 때 바로 감싸므로, 크기를 재는 코드는 감싼 뒤의 너비를 읽는다. 가운데나 오른쪽에
// 맞춘 글자가 한글로 끝나면 끝 자간이 없으니, fig.js가 그만큼 옮겨 둔 x를 되돌린다.
const KO = (function () {
  const H = "ᄀ-ᇿ㄰-㆏가-힣", run = new RegExp(`[${H}]+(?:\\s+[${H}]+)*`, "g"), any = new RegExp(`[${H}]`), last = new RegExp(`[${H}]\\s*$`);
  const NS = "http://www.w3.org/2000/svg";
  function wrap(root) {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
    for (let n; (n = w.nextNode());) {
      const p = n.parentElement;
      if (p && !(p.classList && p.classList.contains("ko")) && p.tagName !== "STYLE" && p.tagName !== "SCRIPT" && any.test(n.textContent)) nodes.push(n);
    }
    for (const n of nodes) {
      const svg = n.parentElement.closest("svg"), s = n.textContent, frag = document.createDocumentFragment();
      let at0 = 0;
      s.replace(run, (m, at) => {
        if (at > at0) frag.appendChild(document.createTextNode(s.slice(at0, at)));
        const k = svg ? document.createElementNS(NS, "tspan") : document.createElement("span");
        k.setAttribute("class", "ko"); k.textContent = m;
        if (svg) k.style.letterSpacing = "0px";
        frag.appendChild(k);
        at0 = at + m.length;
      });
      if (at0 < s.length) frag.appendChild(document.createTextNode(s.slice(at0)));
      n.replaceWith(frag);
    }
  }
  function svgText(t) {
    if (!t || !any.test(t.textContent)) return t;
    const sp = parseFloat(t.style.letterSpacing) || 0, a = t.getAttribute("text-anchor");
    if (sp && last.test(t.textContent) && (a === "middle" || a === "end"))
      t.setAttribute("x", (parseFloat(t.getAttribute("x")) - (a === "middle" ? sp / 2 : sp)).toFixed(3));
    wrap(t);
    return t;
  }
  for (const k of ["text", "rich"]) { const f = Fig[k]; Fig[k] = (...args) => svgText(f(...args)); }
  return { wrap };
})();

const svg = document.getElementById("s"), C = Fig.C;
const E = (tag, a, txt, parent) => Fig.el(parent || svg, tag, a, txt);
const T = (x, y, s, o = {}, parent) => Fig.text(parent || svg, x, y, s, o);
const LINE = C.count;

// 단계: 흰 상자, 왼쪽에 단계 색의 꽉 찬 막대, 고리 두른 원 안의 그림 문자, 굵은 제목, 자세한 줄 둘까지. 제목의 대문자
// 윗선에서 마지막 줄의 아랫선까지 한 덩어리를 상자의 가운데에 둔다.
function box(x, y, w, h, title, lines, color, ic) {
  E("rect", { x, y, width: w, height: h, rx: 0.4, fill: C.paper, stroke: C.rule, "stroke-width": 0.25 });
  E("rect", { x: x - 0.125, y: y - 0.125, width: 1.3, height: h + 0.25, fill: color });
  const tx = x + (ic ? 7.0 : 2.7);
  if (ic) Fig.medalAt(svg, ic, color, x + 4.0, y + h / 2, 4.9);
  const n = lines.length, lh = 2.8, cap = 1.85, desc = n ? 0.45 : 0;   // 줄 간격, 대문자 높이, 아랫선(mm)
  const base = y + (h - (cap + n * lh + desc)) / 2 + cap;               // 제목의 기준선
  T(tx, base, title, { size: 2.6, weight: 700, fill: C.ink });
  lines.forEach((l, i) => T(tx, base + (i + 1) * lh, l, { size: 2.5, fill: C.muted }));   // 2.5 mm = 7.1 pt
  return { x, y, w, h, cx: x + w / 2, cy: y + h / 2, r: x + w, b: y + h };
}
function arrow(d, color = LINE, dash) {
  E("path", { d, fill: "none", stroke: color, "stroke-width": 0.42, "stroke-dasharray": dash, "stroke-linejoin": "round", "marker-end": Fig.marker(svg, color) });
}
const dot = (x, y, color = LINE) => E("circle", { cx: x, cy: y, r: 0.62, fill: color });
// 처리 과정의 한 부분: 옅은 판, 꽉 찬 점 뒤의 Palatino 제목. lx: 제목이 시작하는 자리
// (기본은 점이 상자들의 왼쪽 가장자리에서 시작: 판 안쪽 2.6 mm에서 상자 선의 반을 뺀 자리)
function zone(x, y, w, h, label, lx = x + 2.425) {
  E("rect", { x, y, width: w, height: h, rx: 0.6, fill: C.plate });
  E("circle", { cx: lx + 0.95, cy: y + 2.55, r: 0.9, fill: C.ink });
  T(lx + 2.9, y + 3.6, label, { size: 3.15, serif: true, fill: C.ink });
}

// 두 판의 상자는 x = 3에서 162 사이, 판(0.4에서 164.6)의 2.6 mm 안쪽에 선다. 잇따르는 두 상자는 4.2 mm 떨어져서
// 3.1 mm의 화살표가 남는다. 갈라지거나 모이는 선은 떠나는 상자에서 3.5 mm, 닿는 상자에서 3.8 mm 떨어진다.

// ---- 원격 부분: 크기가 같은 단계 넷(36.6 x 11.4 mm)
zone(0.4, 0.4, 164.2, 19.2, "원격: 이 연구의 BigQuery 프로젝트에서 자료 얻기");
const SLATE = C.count, TEAL = C.contract;
const RW = 36.6, RH = 11.4, RY = 5.6;
const r1 = box(3, RY, RW, RH, "BigQuery", ["Arbitrum One의", "공개 로그"], SLATE, "database");
const r2 = box(43.8, RY, RW, RH, "로그 뽑기", ["스캔 A와 B;", "토픽으로 거르기"], SLATE, "doc");
const r3 = box(84.6, RY, RW, RH, "끝 점 종류 판별", ["트랜잭션 보낸 주소;", "RPC로 코드 읽기"], TEAL, "contract");
const r4 = box(125.4, RY, RW, RH, "표", ["잔액; 계약 사이의 쌍;", "코호트, 라벨"], TEAL, "database");
arrow(`M${r1.r + 0.4},${r1.cy} H${r2.x - 0.7}`); arrow(`M${r2.r + 0.4},${r2.cy} H${r3.x - 0.7}`); arrow(`M${r3.r + 0.4},${r3.cy} H${r4.x - 0.7}`);

// ---- 로컬 부분(제목은 표 불러오기의 가운데로 내려오는 내려받기 연결선의 오른쪽에서 시작)
// 작은 단계 네 줄, 높이 7.4 mm, 1.4 mm 간격. 첫 줄은 원격 단계가 제 판의 위에서 떨어진 만큼 판의 위에서 떨어진다.
// 표 불러오기, 일치도, 내보내기는 한 크기, 25 x 16.2 mm(두 줄).
const LOADX = 3, LOADW = 25;
zone(0.4, 24.0, 164.2, 41.6, "로컬: 내려받은 표로 다시 할 수 있음", LOADX + LOADW / 2 + 2.4);
const rowY = [29.2, 38, 46.8, 55.6], H = 7.4, BIG = 16.2;  // 줄: 화살표 목록과 점수, 점검, 홀드아웃, 발견 순서
const VIO = C.coupled, CYAN = C.rq1, PINK = C.rq3, GREEN = C.rq2;
const COL1 = 35.3, COL2 = 61.9, COL3 = 104.7, RIGHT = 129.7;   // 로컬 상자 세 열의 왼쪽 가장자리; 그 오른쪽 끝
const load = box(LOADX, rowY[1], LOADW, BIG, "표 불러오기", [], SLATE, "database");
const edges = box(COL1, rowY[0], 22.4, H, "화살표 목록", ["만들기"], TEAL);
const scores = box(COL2, rowY[0], 38.6, H, "페이지랭크 점수", ["EndorseRank, AWP, C-PR, S-PR"], VIO);
const align = box(COL3, rowY[0], 25, BIG, "일치도와", ["벤치마크"], CYAN, "bars");
const proxy = box(COL2, rowY[1], 38.6, H, "점검", ["같은 기간 대리 지표"], CYAN);
const hold = box(COL2, rowY[2], RIGHT - COL2, H, "시간 홀드아웃", ["W0과 W1"], PINK, "calendar");
const disc = box(COL2, rowY[3], RIGHT - COL2, H, "발견 순서 검증", ["두 동결의 크롤"], GREEN, "search");
const exp = box(137, rowY[1], 25, BIG, "표와 그림", ["내보내기"], SLATE, "doc");

// 내려받기: 원격의 표에서 표 불러오기로. 그 설명은 가로 구간의 가운데에 선다
arrow(`M${r4.cx},${r4.b + 0.4} V21.8 H${load.cx} V${load.y - 0.7}`, C.text);
const dl = T((load.cx + r4.cx) / 2, 22.66, "한 번 내려받음; 바꾸지 않음", { size: 2.5, fill: C.text, anchor: "middle" });
{ const bb = dl.getBBox(); const r = E("rect", { x: bb.x - 1.2, y: 20.4, width: bb.width + 2.4, height: 2.8, fill: C.paper }); svg.insertBefore(r, dl); }

// 표 불러오기에서 갈라짐: 표 불러오기에서 나온 선이 부채의 가운데에 닿는다
const fx = 31.5;
E("path", { d: `M${load.r + 0.3},${load.cy} H${fx}`, stroke: LINE, "stroke-width": 0.42 });
E("path", { d: `M${fx},${edges.cy} V${disc.cy}`, stroke: LINE, "stroke-width": 0.42, "stroke-linecap": "square" });
arrow(`M${fx},${edges.cy} H${edges.x - 0.7}`);
arrow(`M${fx},${proxy.cy} H${proxy.x - 0.7}`);
arrow(`M${fx},${hold.cy} H${hold.x - 0.7}`);
arrow(`M${fx},${disc.cy} H${disc.x - 0.7}`);
dot(fx, load.cy);
// 주된 줄
arrow(`M${edges.r + 0.4},${edges.cy} H${scores.x - 0.7}`);
arrow(`M${scores.r + 0.4},${scores.cy} H${align.x - 0.7}`);
arrow(`M${proxy.r + 0.4},${proxy.cy} H${align.x - 0.7}`);
// 내보내기로 모임
const gx = 133.2;
E("path", { d: `M${align.r + 0.3},${align.cy} H${gx} M${hold.r + 0.3},${hold.cy} H${gx} M${disc.r + 0.3},${disc.cy} H${gx} M${gx},${align.cy} V${disc.cy}`, stroke: LINE, "stroke-width": 0.42, fill: "none", "stroke-linecap": "square" });
arrow(`M${gx},${exp.cy} H${exp.x - 0.7}`);
dot(gx, exp.cy);
</script>
</body>
</html>
