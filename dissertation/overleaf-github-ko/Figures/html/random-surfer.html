<!doctype html>
<!--
  한국어 원고 그림 fig:random-surfer(2장 「무작위로 돌아다니는 사람으로 풀이하기」 절)의 원본이며, Figures/random-surfer.pdf를
  만든다. LaTeX는 HTML을 읽지 못한다. 이 파일을 고친 뒤 overleaf-github-ko/에서 다음을 실행한다.
      python -B -X utf8 ../overleaf-github/Figures/html/render.py Figures/html/random-surfer.html
  영어 원본은 ../overleaf-github/Figures/html/random-surfer.html이고, 내용과 배치와 크기가 같다. 모양은 영어 그림의
  style.css와 fig.js를 그대로 링크해서 가져오고, 이 파일에는 한글 글꼴과 줄바꿈, 한글 자간만 더한다.

  그림의 내용: 풀어 본 예(「풀어 본 예: 점이 네 개인 보증 그래프에서의 페이지랭크」 절)의 점 네 개짜리 그래프. 계약 A, B, C,
  D가 허락 화살표 A->B(무게 2), A->C(1), B->D(3), C->D(1)로 이어져 있다. 무게 옆에는 그 화살표를 따라가는 걸음의 몫이 있다.
  A에서는 B로 2/3, C로 1/3이고, B와 C에서는 하나뿐인 나가는 화살표가 전부를 가져간다. 돌아다니는 사람은 확률 d로 나가는
  화살표를 무게에 비례해 골라 따라가거나, 확률 1 - d로 고르게 뽑은 점으로 순간 이동한다(그러면 점마다 (1 - d)/|V|).
  순간 이동 부채꼴(회색 점선)은 D에서만 그렸지만, 모든 점에 하나씩 있다. D에는 나가는 화살표가 없어서(매달린 점) D에 있는
  사람은 언제나 고르게 뽑은 점으로 뛴다. 오른쪽 막대는 d = 0.85일 때 풀어 본 예의 정상 벡터, 곧 오래 걸을 때 들르는
  비율이다: A 0.1375, B 0.2154, C 0.1765, D 0.4706.
  "매달린 점"(D 아래)과 "순간 이동"(D의 고리 아래)이라는 글자는 순간 이동의 점선 곡선과 겹치지 않는다.

  모양: 허락 화살표는 모래빛 금색의 굵은 띠, 순간 이동 부채꼴은 회색 점선, 계약 A, B, C는 가는 테 안의 납작한 청록 네모,
  매달린 계약 D는 보라다. 라틴 글자와 숫자는 Bahnschrift(DIN), 변수 d와 V는 Palatino 이탤릭, 막대의 제목은 회색 줄 위의
  명조(한글은 Noto Serif KR)다. 한글은 Noto Sans KR(보통 400, 굵게 700)이고, 한글에는 자간을 두지 않는다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>무작위로 돌아다니는 사람</title>
<link rel="stylesheet" href="../../../overleaf-github/Figures/html/style.css">
<script src="../../../overleaf-github/Figures/html/fig.js"></script>
<style>
/* 한글: 라틴 글꼴 뒤에 Noto 글꼴을 둔다. 두 글꼴은 가변 글꼴(기본 굵기 100)이라 굵기를 늘 적는다. */
:root {
  --serif:"Palatino Linotype", "Book Antiqua", Palatino, "TeX Gyre Pagella", "Cambria Math", "Noto Serif KR", serif;
  --sans:Bahnschrift, "DIN Alternate", "D-DIN", Barlow, "Segoe UI", Arial, "Noto Sans KR", sans-serif;
}
body { font-weight:400; word-break:keep-all; }
b, strong { font-weight:700; }
.h { font-weight:400; }
/* SVG 글자: CSS가 fig.js의 font-family 속성보다 앞서므로, 한글 글꼴을 여기서 더한다 */
svg text.sans { font-family:Bahnschrift, "Noto Sans KR", sans-serif; }
svg text.serif { font-family:"Palatino Linotype", "Book Antiqua", Palatino, "Cambria Math", "Noto Serif KR", serif; }
.ko { letter-spacing:0; }                    /* 한글에는 자간을 두지 않는다(라틴 글자는 영어 그림의 자간) */
  .row { display:grid; grid-template-columns:96mm 1fr; column-gap:4mm; align-items:center; }
  .side .item { display:flex; align-items:flex-start; gap:1.8mm; margin-bottom:1.1mm; font-size:7.1pt; line-height:1.26; color:var(--muted); }
  .side .item svg { flex:none; margin-top:0.45mm; }
  .bars { margin-top:2.1mm; }
  .bars .h { font-size:9pt; margin-bottom:1.5mm; }
  .bars .h .sub { margin-left:auto; padding-left:1.4mm; }
  .b { display:grid; grid-template-columns:4mm 1fr 11mm; align-items:center; column-gap:1.4mm; margin-bottom:0.85mm; }
  .b .n { font-weight:700; color:var(--contract-ink); font-size:7.6pt; }
  .b .n.d { color:var(--coupled); }
  .b .track { height:2.7mm; background:var(--count-bg); }
  .b .fill { display:block; height:100%; background:var(--contract); }
  .b .fill.d { background:var(--coupled); }
  .b .v { font-size:7.3pt; text-align:right; color:var(--text); }
</style>
</head>
<body>
<div class="fig">
  <div class="row">
    <svg id="s" viewBox="0 0 96 52" width="96mm" height="52mm"></svg>
    <div class="side">
      <div class="item"><svg width="7mm" height="3mm" viewBox="0 0 7 3"><path d="M0.2,1.5 H5.2" style="stroke:var(--allow-band)" stroke-width="1.05"/><path d="M3.9,0.35 L6.95,1.5 L3.9,2.65 L4.65,1.5z" style="fill:var(--allow-band)"/></svg>
        <span>확률 <i class="v">d</i>로 나가는 화살표 하나를 따라감. 화살표는 무게에 비례해 고름(괄호 안은 그 몫).</span></div>
      <div class="item"><svg width="7mm" height="3mm" viewBox="0 0 7 3"><path d="M0.3,1.5 H5.4" style="stroke:var(--user)" stroke-width="0.5" stroke-dasharray="1.1 0.8"/><path d="M4.5,0.45 L6.95,1.5 L4.5,2.55 L5.1,1.5z" style="fill:var(--user)"/></svg>
        <span>확률 <span class="m">1 − <i>d</i></span>로 순간 이동: 모든 점이 <span class="m">(1 − <i>d</i>)/<span class="abs">|<i>V</i>|</span></span>를 받음. <b>D</b>에서만 그림.</span></div>
      <div class="item"><svg width="7mm" height="4.2mm" viewBox="0 0 7 4.2" style="margin-top:-0.1mm"><rect x="1.5" y="0.1" width="4" height="4" rx="0.5" fill="#fff" style="stroke:var(--coupled)" stroke-width="0.2"/><rect x="2.15" y="0.75" width="2.7" height="2.7" rx="0.3" style="fill:var(--coupled)"/></svg>
        <span><b>D</b>에는 나가는 화살표가 없음(매달린 점). 그래서 <b>D</b>에 있는 사람은 언제나 고르게 뽑은 점으로 뜀.</span></div>
      <div class="bars">
        <div class="h">오래 걸을 때 들르는 비율<span class="sub">풀어 본 예, <i class="v">d</i> = 0.85</span></div>
        <div class="b"><span class="n d">D</span><span class="track"><span class="fill d" style="width:94.1%"></span></span><span class="v">0.4706</span></div>
        <div class="b"><span class="n">B</span><span class="track"><span class="fill" style="width:43.1%"></span></span><span class="v">0.2154</span></div>
        <div class="b"><span class="n">C</span><span class="track"><span class="fill" style="width:35.3%"></span></span><span class="v">0.1765</span></div>
        <div class="b"><span class="n">A</span><span class="track"><span class="fill" style="width:27.5%"></span></span><span class="v">0.1375</span></div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  const s = document.getElementById("s"), C = Fig.C, h = 4.3, ring = 0.75, hr = h + ring;   // hr: 테의 반 크기
  const N = { A: [6, 26], B: [42, 9], C: [42, 43], D: [76, 26] };
  const allow = { color: C.allowBand, width: 1.05, headSize: 3.1, half: hr, gap: 0.7 };   // 참고 자료의 띠 같은 금색 띠
  const tele = { color: C.user, width: 0.45, dash: "1.1 0.8", half: hr, gap: 0.6 };
  // D에서 나가는 순간 이동 부채꼴(점보다 먼저, 그 아래에 그린다)
  Fig.edge(s, N.D, N.A, Object.assign({}, tele));
  Fig.edge(s, N.D, N.B, Object.assign({ bend: 21 }, tele));
  Fig.edge(s, N.D, N.C, Object.assign({ bend: -21 }, tele));
  Fig.el(s, "path", { d: `M${N.D[0] + hr + 0.3},${N.D[1] - 2.2} c 10,-7 10,11.4 0,4.4`, fill: "none", stroke: C.user,
    "stroke-width": 0.45, "stroke-dasharray": "1.1 0.8", "marker-end": Fig.marker(s, C.user) });
  Fig.text(s, 89.6, 35.2, "순간 이동", { size: 2.5, fill: C.muted, anchor: "middle" });
  // 무게와 걸음의 몫을 단 허락 화살표
  Fig.edge(s, N.A, N.B, Object.assign({}, allow));
  Fig.edge(s, N.A, N.C, Object.assign({}, allow));
  Fig.edge(s, N.B, N.D, Object.assign({}, allow));
  Fig.edge(s, N.C, N.D, Object.assign({}, allow));
  const lab = (x, y, w, p) => {
    const t = Fig.text(s, x, y, w, { size: 3.1, weight: 700, fill: C.allowInk, anchor: "middle" });
    Fig.el(t, "tspan", { "font-size": 2.5, "font-weight": 400, fill: C.allowInk }, ` (${p})`);
  };
  // "전부"는 영어의 "all"보다 넓어서, 그 둘은 D에서 B와 C로 가는 순간 이동 점선에 닿지 않도록 1.6 mm 왼쪽에 둔다
  lab(20.2, 14.0, "2", "2/3"); lab(20.2, 40.9, "1", "1/3"); lab(61.6, 14.4, "3", "전부"); lab(61.6, 40.4, "1", "전부");
  // 점: 계약 A부터 D까지, 가는 테 안의 납작한 네모; 매달린 D는 보라
  for (const [k, [x, y]] of Object.entries(N))
    Fig.node(s, x, y, { half: h, fill: k === "D" ? C.coupled : C.contract, ring: true, ringGap: ring, label: k, labelSize: 3.7 });
  // D 아래, 왼쪽의 D에서 C로 가는 순간 이동 점선과 겹치지 않도록 오른쪽으로 옮긴다
  Fig.text(s, N.D[0] + 2.2, N.D[1] + hr + 3.2, "매달린 점", { size: 2.5, fill: C.coupled, anchor: "middle" });
})();
</script>
<script>
// 한글 글자(와 그 사이의 빈칸)를 <span class="ko">(SVG 안에서는 <tspan>)로 감싸 자간을 0으로 둔다. 그림을 그린 뒤,
// fig.js가 DOMContentLoaded에서 줄 높이를 재기 전에 돈다. 한글만 있는 SVG 글자는 Fig.text가 자간 때문에 옮긴 x도 되돌린다.
(function () {
  const H = "ᄀ-ᇿ㄰-㆏가-힣", run = new RegExp(`[${H}]+(?:\\s+[${H}]+)*`, "g"), any = new RegExp(`[${H}]`);
  const only = new RegExp(`^[${H}\\s]+$`), fig = document.querySelector(".fig"), SVG = "http://www.w3.org/2000/svg";
  for (const t of fig.querySelectorAll("svg text")) {
    if (!only.test(t.textContent) || t.querySelector("tspan")) continue;
    const sp = parseFloat(t.style.letterSpacing) || 0, a = t.getAttribute("text-anchor");
    if (sp && a === "middle") t.setAttribute("x", (+t.getAttribute("x") - sp / 2).toFixed(3));
    if (sp && a === "end") t.setAttribute("x", (+t.getAttribute("x") - sp).toFixed(3));
    t.style.letterSpacing = "0px";
  }
  const w = document.createTreeWalker(fig, NodeFilter.SHOW_TEXT), nodes = [];
  for (let n; (n = w.nextNode());) if (any.test(n.textContent) && n.parentElement.style.letterSpacing !== "0px") nodes.push(n);
  for (const n of nodes) {
    const inSvg = !!n.parentElement.closest("svg"), s = n.textContent, frag = document.createDocumentFragment();
    let last = 0;
    s.replace(run, (m, at) => {
      if (at > last) frag.appendChild(document.createTextNode(s.slice(last, at)));
      const k = inSvg ? document.createElementNS(SVG, "tspan") : document.createElement("span");
      k.setAttribute("class", "ko"); if (inSvg) k.style.letterSpacing = "0px";
      k.textContent = m; frag.appendChild(k); last = at + m.length;
    });
    if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    n.replaceWith(frag);
  }
})();
</script>
</body>
</html>
