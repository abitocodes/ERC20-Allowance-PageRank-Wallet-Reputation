<!doctype html>
<!--
  한국어 원고 그림 fig:kendall-pairs(2장 「순위 상관 이론」 절)의 원본이며, Figures/kendall-pairs.pdf를 만든다.
  LaTeX는 HTML을 읽지 못한다. 이 파일을 고친 뒤 overleaf-github-ko/에서 다음을 실행한다.
      python -B -X utf8 ../overleaf-github/Figures/html/render.py Figures/html/kendall-pairs.html
  영어 원본은 ../overleaf-github/Figures/html/kendall-pairs.html이고, 내용과 배치와 크기가 같다. 모양은 영어 그림의
  style.css와 fig.js를 그대로 링크해서 가져오고, 이 파일에는 한글 글꼴과 줄바꿈, 한글 자간만 더한다.

  그림의 내용: 작은 예로 본 켄달의 타우 b(지어낸 값이고, 이 연구의 자료가 아니다).
  계약 넷 P, Q, R, S에 점수(P 0.9, Q 0.6, R 0.3, S 0.3; R과 S는 동점)와 점검 값(P 12, Q 5, R 7, S 1)이 있다.
  1. 두 순위를 나란히 놓고 계약마다 선을 그었다. Q와 R의 선이 엇갈린다(빨강). "동점"이라고 적은 꺾쇠가 점수에서 R과 S를
     묶는다.
  2. n0 = 6개의 쌍: (P,Q), (P,R), (P,S), (Q,S)는 순서가 맞는 쌍이다(두 순위가 같은 쪽으로 줄 세운다). (Q,R)는 어긋나는
     쌍이다(두 순위가 반대로 줄 세운다). (R,S)는 점수에서 동점이라 어느 쪽에도 들지 않는다.
  3. 식 eq:kendall의 개수: n_c = 4, n_d = 1, n_1 = 1(점수에서 동점인 쌍 하나), n_2 = 0. 그래서
     tau_b = (4 - 1) / sqrt((6 - 1)(6 - 0)) = 3 / sqrt(30), 약 0.55이고, 동점 보정을 빼면 tau_a = (4 - 1) / 6 = 0.50이다.
     분수에서 근호와 그 가로줄은 분수선 아래에, 분수선에서 떨어져 있다.

  모양: 너비와 높이가 같은 카드 셋. 카드마다 가는 테 안에 회색 줄 위의 명조 제목(번호는 고리를 두른 원 안)과 그 내용이 있다.
  둘째와 셋째 카드의 맨 아래 설명은 카드의 마지막 줄에 선다. 계약은 가는 테 안의 납작한 청록 네모이고 글자는 흰색이다.
  P와 S의 선은 회색, 엇갈리는 두 선(Q와 R)은 빨강이고 더 굵다. 쌍은 그 종류의 옅은 색 꼬리표다(초록: 순서가 맞음;
  빨강: 어긋남; 회색: 동점). 개수와 식은 Palatino이고, 센 수는 그 종류의 색이다. 라틴 글자와 숫자는 Bahnschrift(반축소,
  영어 그림의 자간), 한글은 Noto Sans KR(보통 400, 굵게 700)과 제목의 Noto Serif KR이고, 한글에는 자간을 두지 않는다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>켄달의 쌍</title>
<link rel="stylesheet" href="../../../overleaf-github/Figures/html/style.css">
<script src="../../../overleaf-github/Figures/html/fig.js"></script>
<style>
/* 한글: 라틴 글꼴 뒤에 Noto 글꼴을 둔다. 두 글꼴은 가변 글꼴(기본 굵기 100)이라 굵기를 늘 적는다. */
:root {
  --serif:"Palatino Linotype", "Book Antiqua", Palatino, "TeX Gyre Pagella", "Cambria Math", "Noto Serif KR", serif;
  --sans:Bahnschrift, "DIN Alternate", "D-DIN", Barlow, "Segoe UI", Arial, "Noto Sans KR", sans-serif;
}
body { font-weight:400; word-break:keep-all; }
b, strong { font-weight:700; }
.h { font-weight:400; }
/* SVG 글자: CSS가 fig.js의 font-family 속성보다 앞서므로, 한글 글꼴을 여기서 더한다 */
svg text.sans { font-family:Bahnschrift, "Noto Sans KR", sans-serif; }
svg text.serif { font-family:"Palatino Linotype", "Book Antiqua", Palatino, "Cambria Math", "Noto Serif KR", serif; }
.ko { letter-spacing:0; }                    /* 한글에는 자간을 두지 않는다(라틴 글자는 영어 그림의 자간) */
  /* 200 px 카드 셋과 그 사이 12 px: 624 px, 165.1 mm(카드가 같게 나오도록 온 픽셀: style.css 참고) */
  .fig { width:624px; }
  .row { display:grid; grid-template-columns:200px 200px 200px; column-gap:12px; align-items:stretch; }
  .row > .part.panel { padding:5px 8px 6px; }          /* 양쪽 8 px이면 안쪽 184 px */
  .h .badge { margin-left:0.3mm; }
  /* 그림은 카드 안쪽 184 px(48.683 mm)를 채운다; viewBox는 그 너비이고 그린 47 mm가 가운데에 온다 */
  .part > svg { display:block; }
  .foot { margin-top:auto; }                        /* 카드의 설명은 카드 맨 아래에 선다 */
  /* 꼬리표 두 열, 각 90 px, 사이 4 px: 카드 안쪽 184 px */
  .pairs { display:grid; grid-template-columns:90px 90px; gap:1.1mm 4px; margin-top:0.4mm; }
  /* 쌍의 꼬리표: 12 px 줄 위로 4 px, 아래로 3 px. 한 줄이면 높이 19 px에 기준선은 13 px 아래(7.5 pt 대문자가 가운데),
     두 줄이면 31 px */
  .p { display:flex; align-items:center; gap:5px; border-radius:0.5mm; padding:4px 5px 3px; font-size:7.1pt; line-height:12px; }
  .p b { font-size:7.5pt; min-width:6.2mm; color:inherit; }
  .p.c { background:var(--good-bg); color:var(--good); }
  .p.d { background:var(--bad-bg); color:var(--bad); }
  .p.t { background:var(--count-bg); color:var(--count-ink); }
  .nt { font-size:7.1pt; line-height:1.24; color:var(--muted); text-wrap:balance; }   /* 마지막 줄에 낱말 하나만 남지 않게 */
  /* 개수와 식: Palatino, 변수는 그 이탤릭 */
  .cnt { display:grid; grid-template-columns:auto auto; justify-content:start; gap:0.35mm 3mm; font-size:7.1pt; margin:0.4mm 0 1.5mm; align-items:baseline; }
  .cnt .k { color:var(--muted); }
  .cnt .val, .eq { font-family:var(--serif); font-stretch:normal; letter-spacing:0; color:var(--ink); white-space:nowrap; }
  .cnt .val { font-size:7.6pt; }
  .eq { font-size:8.4pt; line-height:1.5; }
  .eq .big { font-size:9.4pt; }
  .eq b { font-weight:700; }
  .g, .eq b.g { color:var(--good); } .r, .eq b.r { color:var(--bad); } .n, .eq b.n { color:var(--count); }
  /* 분수: 분수선은 분자의 것이다. 그 아래 근호는 분수선에서 1.3 mm 떨어지고, 근호의 가로줄은 근호 안 값의 윗테두리로,
     옆에 그린 근호 기호와 이어진다. 분자 위의 여백은 분수선을 등호의 높이에 둔다. */
  .eq .frac { display:inline-flex; flex-direction:column; align-items:stretch; vertical-align:middle; margin:0 0.7mm; padding-top:1mm; }
  .eq .frac > .num { border-bottom:0.25mm solid var(--ink); padding:0 1.5mm 0.15mm; line-height:1.25; text-align:center; }
  .eq .frac > .den { padding:1.3mm 0.8mm 0; display:flex; justify-content:center; }
  .root { display:inline-flex; align-items:flex-start; }
  .root svg { flex:none; display:block; }
  .sqrt { display:block; height:3.5mm; border-top:0.22mm solid var(--ink); padding:0.3mm 0.4mm 0 0.3mm; line-height:1.1; white-space:nowrap; }
</style>
</head>
<body>
<div class="fig">
  <div class="row">
    <div class="part panel">
      <div class="h s"><span class="badge" style="--c:var(--count)">1</span>두 순위<span class="sub">지어낸 값</span></div>
      <svg id="b" viewBox="-0.84 0 48.683 32.3" style="width:184px; height:32.3mm"></svg>
    </div>
    <div class="part panel">
      <div class="h s"><span class="badge" style="--c:var(--count)">2</span>여섯 쌍</div>
      <div class="pairs">
        <div class="p c"><b>P, Q</b>순서가 맞음</div>
        <div class="p c"><b>P, R</b>순서가 맞음</div>
        <div class="p c"><b>P, S</b>순서가 맞음</div>
        <div class="p c"><b>Q, S</b>순서가 맞음</div>
        <div class="p d"><b>Q, R</b>순서가 어긋남</div>
        <div class="p t"><b>R, S</b>점수에서 동점</div>
      </div>
      <div class="nt foot">어느 한 순위에서라도 동점인 쌍은 순서가 맞는 쌍도, 어긋나는 쌍도 아님.</div>
    </div>
    <div class="part panel">
      <div class="h s"><span class="badge" style="--c:var(--count)">3</span><span>켄달의 <i>τ</i><sub>b</sub></span></div>
      <div class="cnt">
        <span class="k">쌍</span><span class="val"><i>n</i><sub>0</sub> = 6</span>
        <span class="k">맞는 쌍, 어긋나는 쌍</span><span class="val"><i>n</i><sub>c</sub> = <b class="g">4</b>, <i>n</i><sub>d</sub> = <b class="r">1</b></span>
        <span class="k">순위마다 동점인 쌍</span><span class="val"><i>n</i><sub>1</sub> = <b class="n">1</b>, <i>n</i><sub>2</sub> = 0</span>
      </div>
      <div class="eq"><span class="big"><i>τ</i><sub>b</sub></span> =
        <span class="frac"><span class="num"><b class="g">4</b> − <b class="r">1</b></span><span class="den"><span class="root"><svg width="1.9mm" height="3.5mm" viewBox="0 0 1.9 3.5"><path d="M0.12,2.2 L0.5,2 L0.98,3.25 L1.79,0.11 H1.9" fill="none" style="stroke:var(--ink)" stroke-width="0.22" stroke-linejoin="round" stroke-linecap="round"/></svg><span class="sqrt">(6 − <b class="n">1</b>)(6 − 0)</span></span></span></span>
        ≈ <b>0.55</b></div>
      <div class="nt foot">동점 보정을 빼면 <span class="m"><i>τ</i><sub>a</sub> = (4 − 1)/6 = 0.50</span></div>
    </div>
  </div>
</div>
<script>
(function () {
  const s = document.getElementById("b"), C = Fig.C;
  const h = 2.5, ring = 0.6, hr = h + ring;                        // 계약과 그 테의 반 크기
  const L = 13.2, R = 36, y = r => 6.5 + (r - 1) * 7.5;            // 두 열; 1위가 맨 위
  Fig.text(s, L, 2.3, "점수", { size: 2.5, weight: 700, fill: C.ink, anchor: "middle" });
  Fig.text(s, R, 2.3, "점검", { size: 2.5, weight: 700, fill: C.ink, anchor: "middle" });
  // 점수 순위: P 1, Q 2, R과 S는 3과 4에서 동점(각자의 줄에 그리고, 동점 꺾쇠로 묶음)
  const left = { P: [1, "0.9"], Q: [2, "0.6"], R: [3, "0.3"], S: [4, "0.3"] };
  const right = { P: [1, "12"], R: [2, "7"], Q: [3, "5"], S: [4, "1"] };
  // 계약마다 선 하나; Q와 R의 선은 엇갈리고, 빨강으로 더 굵게 그린다
  for (const k of ["P", "S", "Q", "R"]) {
    const y1 = y(left[k][0]), y2 = y(right[k][0]), x1 = L + hr + 0.5, x2 = R - hr - 0.5, cross = k === "Q" || k === "R";
    Fig.el(s, "path", { d: `M${x1},${y1} C${x1 + 8.4},${y1} ${x2 - 8.4},${y2} ${x2},${y2}`, fill: "none",
      stroke: cross ? C.bad : C.countFill, "stroke-width": cross ? 0.6 : 0.45 });
  }
  const node = (x, yy, k, v, side) => {
    Fig.node(s, x, yy, { half: h, ring: true, ringGap: ring, label: k, labelSize: 2.7 });
    Fig.text(s, x + side * (hr + 1), yy + 0.9, v, { size: 2.5, fill: C.muted, anchor: side < 0 ? "end" : "start" });
  };
  for (const [k, [r, v]] of Object.entries(left)) node(L, y(r), k, v, -1);
  for (const [k, [r, v]] of Object.entries(right)) node(R, y(r), k, v, +1);
  // 점수에서 R과 S를 묶는 동점 꺾쇠: 오른쪽의 두 값(테에서 1 mm 왼쪽에서 끝나고 너비 3.6 mm)과 왼쪽의 "동점"에서 떨어져 있다
  const bx = L - hr - 1 - 3.6 - 1.2;
  Fig.el(s, "path", { d: `M${bx + 0.7},${y(3) - 1.6} H${bx} V${y(4) + 1.6} H${bx + 0.7}`, stroke: C.count, "stroke-width": 0.35, fill: "none", "stroke-linejoin": "round" });
  const ym = (y(3) + y(4)) / 2;
  const tt = Fig.text(s, bx - 1.6, ym + 0.9, "동점", { size: 2.5, fill: C.count, anchor: "middle" });
  tt.setAttribute("transform", `rotate(-90 ${bx - 1.6} ${ym})`);
})();
</script>
<script>
// 한글 글자(와 그 사이의 빈칸)를 <span class="ko">(SVG 안에서는 <tspan>)로 감싸 자간을 0으로 둔다. 그림을 그린 뒤,
// fig.js가 DOMContentLoaded에서 줄 높이를 재기 전에 돈다. 한글만 있는 SVG 글자는 Fig.text가 자간 때문에 옮긴 x도 되돌린다.
(function () {
  const H = "ᄀ-ᇿ㄰-㆏가-힣", run = new RegExp(`[${H}]+(?:\\s+[${H}]+)*`, "g"), any = new RegExp(`[${H}]`);
  const only = new RegExp(`^[${H}\\s]+$`), fig = document.querySelector(".fig"), SVG = "http://www.w3.org/2000/svg";
  for (const t of fig.querySelectorAll("svg text")) {
    if (!only.test(t.textContent) || t.querySelector("tspan")) continue;
    const sp = parseFloat(t.style.letterSpacing) || 0, a = t.getAttribute("text-anchor");
    if (sp && a === "middle") t.setAttribute("x", (+t.getAttribute("x") - sp / 2).toFixed(3));
    if (sp && a === "end") t.setAttribute("x", (+t.getAttribute("x") - sp).toFixed(3));
    t.style.letterSpacing = "0px";
  }
  const w = document.createTreeWalker(fig, NodeFilter.SHOW_TEXT), nodes = [];
  for (let n; (n = w.nextNode());) if (any.test(n.textContent) && n.parentElement.style.letterSpacing !== "0px") nodes.push(n);
  for (const n of nodes) {
    const inSvg = !!n.parentElement.closest("svg"), s = n.textContent, frag = document.createDocumentFragment();
    let last = 0;
    s.replace(run, (m, at) => {
      if (at > last) frag.appendChild(document.createTextNode(s.slice(last, at)));
      const k = inSvg ? document.createElementNS(SVG, "tspan") : document.createElement("span");
      k.setAttribute("class", "ko"); if (inSvg) k.style.letterSpacing = "0px";
      k.textContent = m; frag.appendChild(k); last = at + m.length;
    });
    if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    n.replaceWith(frag);
  }
})();
</script>
</body>
</html>
